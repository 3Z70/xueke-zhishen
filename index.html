<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九门学科 · 神明试炼</title>
<style>
/* ============ RESET & BASE ============ */
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --gold:#e8c15a; --purple:#b78cff; --darkred:#c0392b; --gray:#8a8a8a;
  --white:#f5f2e9; --bg:#0d0d13;
}
html,body{ height:100%; }
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  color:var(--white);
  background:radial-gradient(ellipse at 50% -20%, #1a1a2e 0%, var(--bg) 60%, #050508 100%);
  min-height:100vh;
  overflow-x:hidden;
}
input,button{ font-family:inherit; }

/* ============ SCREENS ============ */
.screen{ display:none; min-height:100vh; padding:24px; position:relative; }
.screen.active{ display:flex; flex-direction:column; align-items:center; justify-content:center; animation:fadeIn .6s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }

/* ============ MENU (TITLE) ============ */
#menu{ text-align:center; }
.title-main{ font-size:44px; letter-spacing:8px; margin-bottom:8px;
  background:linear-gradient(120deg,#e8c15a,#b78cff,#e8c15a);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.title-sub{ color:#8b8b9e; font-size:15px; letter-spacing:4px; margin-bottom:40px; }
.title-deco{ font-size:18px; color:#5b5b70; letter-spacing:2px; }

/* ============ GOD GRID ============ */
.god-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; max-width:720px; margin:0 auto; }
.god-card{ position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.08); border-radius:14px;
  padding:24px 12px; background:rgba(255,255,255,.03); cursor:pointer; transition:.3s; text-align:center; }
.god-card:hover{ transform:translateY(-4px); border-color:currentColor; }
.god-card .sym{ font-size:40px; display:block; margin-bottom:8px; }
.god-card .nm{ font-size:20px; letter-spacing:2px; font-weight:600; }
.god-card .god{ font-size:12px; color:#9a9ab0; margin-top:4px; letter-spacing:1px; }
.god-card .mark{ position:absolute; top:10px; right:12px; font-size:20px; }
.god-card.gold-glow{ box-shadow:0 0 22px rgba(232,193,90,.25); }

/* Watcher (0) entrance */
#watcherBtn{ display:none; width:100%; max-width:720px; margin:28px auto 0; text-align:center; }
#watcherBtn .zero{ font-size:64px; color:#c9c9ff; cursor:pointer; animation:spin 4s linear infinite; text-shadow:0 0 30px rgba(170,170,255,.4); }
@keyframes spin{ from{transform:rotate(0);} to{transform:rotate(360deg);} }
#watcherBtn .zt{ font-size:13px; color:#8a8ab0; margin-top:6px; letter-spacing:3px; }

#footer-progress{ margin-top:20px; color:#6a6a80; font-size:12px; letter-spacing:1px; }

/* Controls */
.controls{ margin-top:26px; display:flex; gap:14px; }
.ctl-btn{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); color:var(--white);
  padding:9px 18px; border-radius:8px; cursor:pointer; font-size:13px; letter-spacing:1px; transition:.25s; }
.ctl-btn:hover{ background:rgba(255,255,255,.12); }
.ctl-btn.danger:hover{ background:rgba(192,57,43,.25); border-color:var(--darkred); }

/* ============ QUESTION SCREEN ============ */
.hidden{ display:none !important; }
#question{ max-width:720px; width:100%; justify-content:flex-start; padding-top:40px; }
.topbar{ position:absolute; top:14px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; }
.topbar .god-tag{ font-size:14px; letter-spacing:2px; opacity:.8; }
.topbar .exit{ background:none; border:1px solid rgba(255,255,255,.2); color:var(--white); padding:4px 12px;
  border-radius:6px; cursor:pointer; font-size:12px; opacity:.7; transition:.2s; }
.topbar .exit:hover{ opacity:1; background:rgba(255,255,255,.1); }

.hud{ display:flex; gap:16px; font-size:12px; color:#a0a0b8; margin-bottom:6px; flex-wrap:wrap; align-items:center; }
.hud .qnum{ font-size:26px; font-weight:700; color:var(--gold); letter-spacing:1px; }
.hud .bar{ margin-bottom:0; }
.hud span b{ color:var(--white); font-weight:600; }
.sep-line{ width:100%; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent); margin:14px 0; }

.difficulty{ font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid; align-self:flex-start; }
.dif-jichu{ color:#8fd3ff; border-color:#8fd3ff55; }
.dif-tigao{ color:#ffd68f; border-color:#ffd68f55; }
.dif-gaozhong{ color:#ff9fb0; border-color:#ff9fb066; }

.story-intro{ font-size:13px; color:#c8c8d8; font-style:italic; margin-bottom:16px; line-height:1.8; }

.question-panel{ width:100%; padding:22px; border-radius:14px; background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1); margin-bottom:16px; }
.question-panel .stem{ font-size:17px; line-height:1.9; white-space:pre-wrap; }
.question-panel .poem{ font-size:15px; line-height:2; color:#dcdce8; font-style:italic; display:block; }

.options{ width:100%; display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
.option{ text-align:left; padding:14px 16px; border-radius:10px; background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1); color:var(--white); cursor:pointer; font-size:15px; line-height:1.6; transition:.2s; }
.option:hover{ background:rgba(255,255,255,.1); border-color:currentColor; }
.option .ol{ display:inline-block; width:26px; font-weight:700; color:var(--gold); }
.option.answered{ cursor:default; }
.option.correct{ background:rgba(46,204,113,.16); border-color:#2ecc71; }
.option.wrong{ background:rgba(231,76,60,.16); border-color:#e74c3c; }
.option.dim{ opacity:.45; }

.action-bar{ width:100%; display:flex; gap:12px; justify-content:center; margin-bottom:18px; flex-wrap:wrap; }
.action-btn{ padding:12px 26px; border-radius:10px; font-size:14px; cursor:pointer; letter-spacing:2px; border:1px solid; transition:.25s; font-weight:600; }
.action-btn.own{ background:rgba(232,193,90,.12); border-color:var(--gold); color:var(--gold); }
.action-btn.own:hover{ background:rgba(232,193,90,.25); }
.action-btn.help{ background:rgba(120,180,255,.1); border-color:#78b4ff; color:#78b4ff; }
.action-btn.help:hover:not(:disabled){ background:rgba(120,180,255,.25); }
.action-btn.help:disabled{ opacity:.35; cursor:not-allowed; }
.action-btn.cheat{ background:rgba(192,57,43,.12); border-color:var(--darkred); color:#ff7b6b; }
.action-btn.cheat:hover{ background:rgba(192,57,43,.28); }

.feedback{ width:100%; padding:18px; border-radius:12px; background:rgba(0,0,0,.25); min-height:78px;
  font-size:14.5px; line-height:1.9; white-space:pre-wrap; border-left:3px solid var(--gold); }
.feedback .speaker{ display:block; font-size:12px; letter-spacing:2px; color:#9a9ab4; margin-bottom:6px; }
.feedback.helped{ border-left-color:#78b4ff; background:rgba(0,20,40,.3); }
.feedback.cheated{ border-left-color:var(--darkred); background:rgba(30,0,0,.3); }
.feedback.locked{ border-left-color:#666; opacity:.85; }
.feedback.heartz{ border-left-color:#ff7bd5; background:rgba(255,50,140,.07); }

.btn-next{ margin-top:8px; padding:12px 34px; border-radius:10px; border:1px solid var(--gold); color:var(--gold);
  background:rgba(232,193,90,.12); font-size:14px; letter-spacing:3px; cursor:pointer; font-weight:600; transition:.25s; }
.btn-next:hover{ background:rgba(232,193,90,.28); }

/* ============ ENDING SCREEN ============ */
#ending{ max-width:720px; width:100%; }
.ending-badge{ font-size:15px; letter-spacing:3px; padding:7px 20px; border-radius:20px; border:1px solid; margin-bottom:26px; }
.ending-badge.perfect{ color:var(--gold); border-color:var(--gold); background:rgba(232,193,90,.1); }
.ending-badge.normal{ color:var(--white); border-color:var(--white); background:rgba(255,255,255,.05); }
.ending-badge.depend{ color:var(--purple); border-color:var(--purple); background:rgba(183,140,255,.1); }
.ending-badge.fallen{ color:#ff7b6b; border-color:var(--darkred); background:rgba(192,57,43,.12); }
.ending-badge.fail{ color:var(--gray); border-color:var(--gray); background:rgba(138,138,138,.08); }

.ending-text{ font-size:16px; line-height:2.15; white-space:pre-wrap; text-align:center;
  padding:24px; background:rgba(255,255,255,.03); border-radius:14px; border:1px solid rgba(255,255,255,.08); }
.ending-title{ margin-top:22px; color:#b0b0c8; font-size:12px; letter-spacing:2px; }

.stats-row{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:18px 0; }
.stat{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); padding:10px 16px; border-radius:10px; font-size:13px; }
.stat b{ color:var(--gold); }

/* ============ WATCHER ============ */
#watcher{ max-width:640px; width:100%; text-align:center; }
.watspeech{ font-size:17px; line-height:2.2; white-space:pre-wrap; margin-bottom:26px; color:#dcdcec; }
.whos{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:20px; }
.who{ padding:14px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04);
  cursor:pointer; font-size:14px; transition:.2s; color:var(--white); }
.who:hover{ background:rgba(255,255,255,.12); transform:translateY(-2px); }
.who.self{ border-color:#ffd6a5; }
.who.leave{ border-color:#999; }
.who .wn{ font-size:11px; color:#9a9ab4; display:block; margin-top:3px; }

/* ============ DIALOG MODAL ============ */
.modal{ position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
.modal.active{ display:flex; }
.modal-box{ max-width:560px; width:100%; background:#15151f; border:1px solid rgba(255,255,255,.15); border-radius:16px;
  padding:28px; animation:pop .3s ease; text-align:center; max-height:85vh; overflow-y:auto; }
@keyframes pop{ from{transform:scale(.95); opacity:0;} to{transform:none; opacity:1;} }
.modal-box .m-title{ font-size:15px; letter-spacing:2px; color:#b78cff; margin-bottom:14px; }
.modal-box .m-text{ font-size:14.5px; line-height:1.9; white-space:pre-wrap; color:#e6e6f2; }
.modal-box .m-btn{ margin-top:20px; padding:10px 30px; border-radius:9px; border:1px solid var(--gold); color:var(--gold);
  background:rgba(232,193,90,.12); cursor:pointer; font-size:14px; letter-spacing:2px; }
.modal-box .m-btn:hover{ background:rgba(232,193,90,.25); }
.modal-box .m-btn.plain{ border-color:#999; color:#ccc; background:rgba(255,255,255,.05); }

/* ============ RECORDS MODAL ============ */
.records{ text-align:left; }
.records .r h3{ font-size:14px; letter-spacing:1px; color:var(--gold); margin:14px 0 6px; }
.records .r p{ font-size:13px; color:#d0d0e0; line-height:1.7; padding-left:8px; border-left:2px solid rgba(255,255,255,.1); }
.records .r p.purple{ border-color:var(--purple); color:#d8ccff; }
.records .r p.red{ border-color:var(--darkred); color:#ffc0b6; }
.records .r p.gray{ border-color:var(--gray); color:#b0b0c0; }

/* ============ RESPONSIVE ============ */
@media(max-width:600px){
  .god-grid{ grid-template-columns:repeat(2,1fr); }
  .title-main{ font-size:32px; letter-spacing:5px; }
  .question-panel{ padding:16px; }
  .option{ font-size:14px; }
}
</style>
</head>
<body>

<!-- ============ SCREEN: MENU ============ -->
<div id="menu" class="screen active">
  <div class="title-deco">乙女 · 文字 · 恋爱对决</div>
  <h1 class="title-main">九门学科 · 神明试炼</h1>
  <div class="title-sub">—— 做题是试炼，求助是依赖，作弊是背叛 ——</div>

  <div class="god-grid" id="godGrid"></div>

  <div id="watcherBtn">
    <div class="zero" id="watcherZero">0</div>
    <div class="zt">第十门学科 · 选择</div>
  </div>

  <div class="controls">
    <button class="ctl-btn" id="btnRecords">羁绊档案</button>
    <button class="ctl-btn" id="btnHow">试炼说明</button>
    <button class="ctl-btn danger" id="btnReset">重置全部</button>
  </div>

  <div id="footer-progress"></div>
</div>

<!-- ============ SCREEN: QUESTION ============ -->
<div id="question" class="screen">
  <div class="topbar">
    <div class="god-tag" id="godTag"></div>
    <button class="exit" id="btnExit">退出试炼</button>
  </div>

  <div class="hud" style="margin-top:30px;">
    <div class="qnum" id="qNum">第 1 / 5 题</div>
    <div class="difficulty dif-jichu" id="difficulty">初中基础</div>
    <div class="bar" style="margin-left:auto"><span id="hudHelp">求助剩余 <b>3</b></span></div>
  </div>
  <div class="sep-line"></div>

  <div class="story-intro" id="storyIntro"></div>

  <div class="question-panel">
    <div class="stem" id="stem"></div>
  </div>

  <div class="options" id="options"></div>

  <div class="action-bar" id="actionBar">
    <button class="action-btn help" id="btnHelp">求助神明</button>
    <button class="action-btn cheat" id="btnCheat">作弊（偷看答案）</button>
  </div>

  <div class="feedback hidden" id="feedback"></div>
  <div class="btn-next hidden" id="btnNext">继 续</div>
</div>

<!-- ============ SCREEN: ENDING ============ -->
<div id="ending" class="screen">
  <div class="ending-badge" id="endBadge">完美通关</div>
  <div class="ending-text" id="endText"></div>
  <div class="stats-row" id="endStats"></div>
  <div class="ending-title" id="endTitle"></div>
  <div style="margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
    <button class="btn-next" id="btnReplay" style="border-color:#999; color:#ccc; background:rgba(255,255,255,.05);">重玩这科</button>
    <button class="btn-next" id="btnBackMenu">返回主界面</button>
  </div>
</div>

<!-- ============ SCREEN: WATCHER ============ -->
<div id="watcher" class="screen">
  <div class="watspeech" id="watSpeech"></div>
  <div class="whos" id="whoOptions"></div>
</div>
<div id="watcherResult" class="screen">
  <div class="ending-badge perfect" id="watResultBadge">结局</div>
  <div class="ending-text" id="watResultText"></div>
  <div style="margin-top:24px;">
    <button class="btn-next" id="btnWatBack">返回主界面</button>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="m-title" id="modalTitle"></div>
    <div class="m-text" id="modalText"></div>
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="m-btn" id="modalOk">确 定</button>
      <button class="m-btn plain hidden" id="modalCancel">取 消</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================
   SAVE / GLOBAL STATE
========================================================= */
const LS_KEY = "shenming_trial_v1";
function loadSave(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || defaultSave(); }
  catch(e){ return defaultSave(); }
}
function defaultSave(){
  return { gods:{}, watcher:{ unlocked:false, chosen:null }, history:[] };
}
let G = loadSave();
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(G)); }catch(e){}
}

/* =========================================================
   GOD SHORTHAND
========================================================= */
const GODS = [
  {id:'math',   name:'逻格斯', sub:'数学之神', sym:'∑', color:'#7ec8ff', focus:'理性'},
  {id:'lang',   name:'墨卿',   sub:'语文之神', sym:'墨', color:'#9be0a8', focus:'真心'},
  {id:'eng',    name:'艾洛',   sub:'英语之神', sym:'A', color:'#ffd27e', focus:'敢用'},
  {id:'phys',   name:'诺安',   sub:'物理之神', sym:'Ω', color:'#ff9fb0', focus:'好奇'},
  {id:'chem',   name:'霓生',   sub:'化学之神', sym:'⚗', color:'#ff8fc0', focus:'尝试'},
  {id:'bio',    name:'苼',     sub:'生物之神', sym:'🌿', color:'#8fecb0', focus:'真实'},
  {id:'hist',   name:'溯',     sub:'历史之神', sym:'卅', color:'#d8b78f', focus:'诚实'},
  {id:'geo',    name:'屿',     sub:'地理之神', sym:'⊹', color:'#8fd3ff', focus:'探索'},
  {id:'pol',    name:'衡',     sub:'政治之神', sym:'衡', color:'#c9a6ff', focus:'立场'},
];

/* =========================================================
   QUESTIONS DATABASE
========================================================== */
let DATA = {};

DATA.math = [
{ diff:0, stem:"下列实数中，无理数是——",
  opts:["√4","3.14","π","-2"], ans:2,
  intro:"祂站在你身后，声音平静：“第一题，热身。不要让我失望。”",
  help:"祂扫了一眼选项：“有理数都能写成分数。√4 等于什么？3.14 是什么？想清楚这两个，剩下的就是答案。”",
  cheat:"你偷偷看到了。正确答案是 <b>C</b>，π 是无理数。……祂似乎察觉了什么，但没有说。",
  fbCorr:"“……不错。”",
  fbErr:"“你选错了。√4 是 2。3.14 是有限小数。下次不要凭感觉。”",
  fbHelp:"“你问了我。好。记住，有理数和无理数的区别，不在于它看起来有多奇怪。”",
  fbCheat:"“你的动作很轻。但还不足以瞒过我。没有下次。”",
  cheatErr:"“你看了答案，还是错了。我连惩罚你的兴趣都没有了。”" },
{ diff:0, stem:"已知 a+b=5，ab=6，则 a²+b² 的值为——",
  opts:["13","17","25","19"], ans:0,
  intro:"祂看了你一眼：“这题，我小学就会。但对你，我允许你慢慢想。”",
  help:"祂轻敲桌面：“回忆完全平方公式。a²+b² 和 a+b、ab 之间，有桥梁。”",
  cheat:"正确答案是 <b>A</b>。a²+b² = (a+b)² - 2ab = 25 - 12 = 13。你迅速移开视线，但祂可能已经看见了。",
  fbCorr:"“你比我想象的，更专注。”",
  fbErr:"“错了。你需要重新理解完全平方公式。回去再推一遍。”",
  fbHelp:"“向我求助，不算丢人。你至少知道自己不会什么。”",
  fbCheat:"“公式就在那里。你偏要选择最不堪的方式。我记下了。”",
  cheatErr:"“看了答案还错。你连偷都偷不来。”" },
{ diff:1, stem:"在△ABC中，∠A=40°，∠B=60°，则∠C的外角等于——",
  opts:["80°","100°","120°","140°"], ans:1,
  intro:"祂轻敲桌面：“角度。你看我的时候，用的是多少度角？”",
  help:"祂说：“先求∠C。再想外角定义。三角形内角和是多少？你记得的。”",
  cheat:"正确答案是 <b>B</b>。∠C=80°，外角=180°-80°=100°。你抬头时，祂正看着你，面无表情。",
  fbCorr:"“很好。继续。”",
  fbErr:"“你搞混了内角和外角。静下来，把图形画出来。”",
  fbHelp:"“这题你不该错的。但既然问了，就听好：外角和内角互补。”",
  fbCheat:"“角度不会因为你偷看就改变。你的行为让我感到无聊。”",
  cheatErr:"“连角度都能看错，你可真会辜负我的时间。”" },
{ diff:1, stem:"已知一次函数 y = kx + b 经过点 (1, 2) 和 (2, 4)，则 k 的值为——",
  opts:["1","2","3","4"], ans:1,
  intro:"祂把目光从你身上移开：“函数。你和我之间，也不过是两个变量。”",
  help:"祂指向第一个点：“把两个点的坐标分别代入。你会得到两个方程。消掉 b，剩下的就是答案。”",
  cheat:"正确答案是 <b>B</b>。k=2。你看到这行字时，祂的声音从背后传来：“你觉得这样有意义吗？”",
  fbCorr:"“你的计算很干净。继续。”",
  fbErr:"“你算错了。不要只凭直觉。用方程。”",
  fbHelp:"“好，我告诉你方法。但答案要你自己算出来。”",
  fbCheat:"“你看到了不该看的。这次我不揭穿你。没有下次。”",
  cheatErr:"“我给你机会，你自己放弃。愚不可及。”" },
{ diff:2, stem:"已知函数 f(x)=ln x + ax + 1 在区间 (0, +∞) 上单调递增，则 a 的取值范围是——",
  opts:["a ≥ 0","a > 0","a ≥ -1","a ≤ 0"], ans:0,

  chem:{title:"隐藏结局 · 化学线 · “你是我的不可逆反应”", text:"“霓生。”话音刚落，你听到一声短促的轻笑，像火柴划燃。<br>其他神明的轮廓被一团无色却炽热的气流冲散。霓生从淡紫色的雾中向你走来，裙摆上没有风，却像燃烧一样翻涌。<br>“你可真会选。明知道我危险，还是点了我的名字。”她停在你面前，微微倾身，眼睛像盛满溶液的烧杯，亮得惊人。<br>“我这一生做过无数次反应。有的爆炸，有的失败，有的无声无色。可当你叫出‘霓生’的时候，我终于知道——最完美的反应，需要最正确的配方。你，就是我的最后一种原料。”<br>她笑起来，舌尖轻轻舔了一下下唇，随后一把将你拉近。<br>“接下来，你会看到很多颜色。别害怕。那是我们之间正在生成新的东西。”<br>你四周的一切开始像被加热的气体一样扭曲、绚烂，紫红蓝绿的光在空气中炸开，美得近乎危险。<br><br><b>【隐藏结局·化学线解锁：“你是我的不可逆反应”】</b><br>你住进了霓生的实验室。她每天都在你身上制造小小的奇迹——变色的液体、悬浮的晶体、不会熄灭的火焰。她说，你对她的意义，就是让不可逆这三个字，终于用对了一次。"},
  bio:{title:"隐藏结局 · 生物线 · “你将我种成春天”", text:"“苼。”你刚念出这个名字，就感觉有什么极细极软的东西攀上你的脚踝。像是藤蔓，又像手指。<br>其他神明安静地退场，只有苼站在不远处，微笑着看你。她的眼睛像琥珀，里面封存着一个春天的全部生命力。<br>“你选择了我。真好。我一直在等这个。”她慢慢走近你，把垂下的发丝别到耳后，动作温柔得像在对待最脆弱的胚芽。<br>“你知道吗？生物的最终目的不是变强，而是被记住。基因也好，名字也好，总要留下点什么。你叫我的时候，我就知道，我的基因里已经写满你了。”<br>她捧住你的脸，指尖温热得像阳光下的花瓣。<br>“我想把你留在我身边。不是关起来，是让你活着，活得比任何人都自由。你的每一次呼吸，我都会好好收藏。”<br>你周围开始长出大片大片的绿色，枝叶柔软地绕过你的手臂，像拥抱，又像呼吸。<br><br><b>【隐藏结局·生物线解锁：“你将我种成春天”】</b><br>你和苼住进了一座巨大的植物园。那里没有冬天。她每天会用很多时间看你，看你睡着，看你笑，看你眼角细小的变化。她说，这就是生命最动人的地方：不可复制，不可重来。"},
  hist:{title:"隐藏结局 · 历史线 · “你是我所有过去唯一的未来”", text:"“溯。”你的声音很轻，却像在空旷的殿堂里撞出了回音。其他神明的影子肉眼可见地褪色，像老照片在时间里风化。<br>只有溯还站在那里，一身旧色，像是从某段尘封的历史里专程为你醒来。他朝你走来，脚步极慢，每一步都像走过了很多很多年。<br>“我这一生，听过太多人呼唤我的名字。帝王、书生、流民、妇人。可只有你，叫得最轻，却让我听得最清楚。”他停在你面前，眼里有阅遍兴亡后的疲惫，也有终于被人认出的光亮。<br>“我不知道我们能走多久。但我知道，从此刻起，你不再只是历史的一部分。你会成为我最想反复翻阅的那一页。”<br>他向你伸出手，掌心有陈旧的温度。你握住时，像是握住了很多年之前就该握住的东西。四周卷起旧纸、烛火、铜锈的味道。你们站在一起，像两页终于合上的书。<br><br><b>【隐藏结局·历史线解锁：“你是我所有过去唯一的未来”】</b><br>你陪伴着溯，走过了他记忆里许多已经消失的地方。他记性太好，好到每个细节都历历在目。但他对你说：“以后我不再去记那些了。我想把剩下的记忆，都用来装你。”"},
  geo:{title:"隐藏结局 · 地理线 · “你是我唯一想定居的远方”", text:"“屿。”你刚喊出这个名字，就有一阵风突然灌进来，带着海盐和远方草木的味道。其他神明的轮廓被吹得七零八落，只有屿大步朝你走来，脸上带着那种让人无法拒绝的笑。<br>“我就知道你会选我！”他几乎是跑过来的，在你面前却猛地停住，突然变得有些局促。<br>“我啊，去过太多地方。每次到了一个新地方，都会想，如果身边有个人一起看就好了。现在好了，你来了。”他拉住你的手，像抓住了一件失而复得的行李，带着你就要往前走。<br>“我们走吧。去很远很远的地方。你可能不认识路，但没关系。我就是你的地图、你的指南针、你的天气预告。”<br>你面前的空白忽然裂开，山川、河流、晨昏、日月飞快地流转。他始终站在你前面，却一直回头看你。<br><br><b>【隐藏结局·地理线解锁：“你是我唯一想定居的远方”】</b><br>你和屿去了很多很多地方。有些在地图上，有些在梦里。有一天他忽然对你说：“我哪儿也不想去了。我想在你的眼睛里住下来，那个地方最好看。”"},
  pol:{title:"隐藏结局 · 政治线 · “你是我的根本原则”", text:"“衡。”你声音坚定，像念出一句早已想好的誓言。其他神明的影像悄然隐去，像散去的朝会。衡站在原地，双手负后，眼神里翻涌着克制的情绪。<br>他朝你走来，每一步都像踏在某种既定的秩序上。可他最终停在你面前，语气却出奇地轻。<br>“你选择了我。那么，我也有义务告诉你，我不会让你受任何委屈。在我的秩序里，你永远是优先项。”他握住你的手腕，力度恰到好处，既不是束缚，也不是试探。<br>“我不擅长说什么漂亮话。但我可以向你保证，从今天起，你的每一次表达都会被我听见，你的每一个选择都会被我尊重。你不需要再摇晃了。我会替你挡住那些。”<br>你感到自己被一种难以言喻的安稳包裹。不是热烈的，也不是冰冷的。像一纸被认真签署的盟约。<br><br><b>【隐藏结局·政治线解锁：“你是我的根本原则”】</b><br>你和衡建立起了一种旁人无法理解的关系：克制、坚定、互为底线。他从不轻易说爱，但他做的每件事都在告诉你——在你面前，所有的利益权衡都要让路。"},
  self:{title:"真结局 · “神不需要你，但你需要你自己”", text:"你沉默了很久，最后说：“……我想被我自己记住。”<br>话音落下的瞬间，九道虚影同时看向你。祂们没有愤怒，没有失望。反而都笑了。<br>然后祂们一个接一个地消失。最终，连你身处的那片空白也消失了。你站在一片平静的黑暗里，脚下有微弱的光，像镜子，又像水面。<br>一个声音从你心里升起，那是你自己的声音，却比任何时候都清晰。<br>“那么，第十门学科，你已通过。你已经见过九位神明，却最后选了自己。你不是狂妄，你只是终于承认，那些所有让你心动的瞬间，只有你自己记得最深。”<br>“去吧。从现在起，你不再需要神明。因为你就是自己的学科、自己的答案、自己的方向。”<br>你感觉身体变得很轻，像卸下了什么。然后你看见一道门，门的另一头，是再普通不过的早晨，阳光从窗户斜照进来，桌上放着一本书和一杯还冒着热气的茶。<br><br><b>【真结局解锁：“神不需要你，但你需要你自己”】</b><br>你回到了日常生活中。你不再需要做题，不再需要求助。可你知道，九位神明都还在各自的领域里，偶尔会想起你。你也会想起祂们。想起数学、语文、英语，想起那个陪你走过漫长题海的自己。你没有再回去。因为有些路，走过一次就够了。"},
  leave:{title:"隐藏自由结局 · “你谁都不属于，连你自己都不必定义”", text:"你沉默了很久。然后，你转身，朝那片空白之外走去。<br>没有神明拦你。没有声音响起。你只是走，一步比一步轻。<br>一直走到身后那些虚影完全消失。一直走到面前出现一扇极窄的门。你推门出去时，忽然听到一阵风声，像有人在你身后轻轻叹了一口气。又像是祝福。<br><br><b>【隐藏自由结局解锁：“你谁都不属于，连你自己都不必定义”】</b><br>你没有留下。没有选择任何一位神明，也没有选择自己。你就这么走回了现实世界。九门学科的图标从主界面上一个接一个淡去，最后只剩下一片干净的空白。但那片空白不空洞。它像一张刚刚铺开的纸，等你在上面写点别的什么。从此，题海与你无关，神明与你两清。你自由了，真的自由了。"}
};

/* =========================================================
   RUNTIME STATE (single trial)
========================================================= */
let run = null;
function newRun(gid){
  return {
    gid, idx:0, trust:0,
    helpLeft:3, cheatCombo:0, corrCombo:0, heartCount:0,
    helpUsed:0, cheatUsed:0, nonIndep:0, correct:0,
    answered:false, usedHelpThisQ:false, usedCheatThisQ:false,
    lockedNext:false, wasLocked:false, records:[]
  };
}
const MARK_MAP = {'perfect':'✓','normal':'✓','depend':'✦','fallen':'✦','fail':'✗'};

/* =========================================================
   DOM refs
========================================================= */
const $ = id => document.getElementById(id);
const screens = { menu:$('menu'), question:$('question'), ending:$('ending'), watcher:$('watcher'), watcherResult:$('watcherResult') };
function show(id){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[id].classList.add('active');
  window.scrollTo(0,0);
  const q=$('question').classList;
  if(id==='question'){ q.remove('hidden'); } else { q.add('hidden'); }
}

/* =========================================================
   RENDER MENU
========================================================= */
function renderMenu(){
  G = loadSave();
  const grid = $('godGrid'); grid.innerHTML='';
  GODS.forEach(g=>{
    const st = G.gods ? (G.gods[g.id]||'none') : 'none';
    const card = document.createElement('div');
    card.className='god-card';
    card.style.color=g.color;
    if(st==='perfect'||st==='normal') card.classList.add('gold-glow');
    let mark='';
    if(st!=='none') mark = `<div class="mark" style="color:${st==='fallen'||st==='fail'?'#888':(st==='depend'?'#b78cff':'#e8c15a')}">${MARK_MAP[st]||'✗'}</div>`;
    card.innerHTML=`<span class="sym">${g.sym}</span><div class="nm">${g.name}</div><div class="god">${g.sub}</div>${mark}`;
    card.onclick=()=>{ startTrial(g.id); };
    grid.appendChild(card);
  });

  // watcher unlock: all 9 gods have perfect/normal/depend
  let cleared=0, total=0;
  GODS.forEach(g=>{ total++; const s=G.gods ? G.gods[g.id] : 'none'; if(s==='perfect'||s==='normal'||s==='depend') cleared++; });
  $('watcherBtn').style.display = (cleared===total) ? 'block':'none';

  $('footer-progress').textContent = `已通过 ${cleared} / ${total} 学科${G.watcher && G.watcher.chosen ? ' · 已探索第十门':''}`;
}

/* =========================================================
   START TRIAL
========================================================= */
function startTrial(gid){
  run = newRun(gid);
  const g = GODS.find(x=>x.id===gid);
  $('godTag').textContent = `${g.sub} · ${g.name}`;
  $('qNum').textContent = `第 1 / 5 题`;
  $('actionBar').style.display='flex';
  show('question');
  renderQuestion();
}

/* =========================================================
   RENDER QUESTION
========================================================= */
function renderQuestion(){
  const gid = run.gid;
  const g = GODS.find(x=>x.id===gid);
  const q = DATA[gid][run.idx];
  const num = run.idx+1;
  $('qNum').textContent = `第 ${num} / 5 题`;
  const diff = ['初中基础','初中提高','高中中档'][q.diff];
  const dEl=$('difficulty'); dEl.textContent=diff;
  dEl.className='difficulty dif-'+(['jichu','tigao','gaozhong'][q.diff]);

  $('hudHelp').innerHTML = `求助剩余 <b>${run.helpLeft}</b>`;

  let intro = q.intro||'';
  if(num===5 && q.q5intro){ intro = q.q5intro; }
  $('storyIntro').innerHTML = intro;

  $('stem').innerHTML = q.stem;

  const opts=$('options'); opts.innerHTML='';
  const letters=['A','B','C','D'];
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='option';
    btn.dataset.i=i;
    btn.innerHTML=`<span class="ol">${letters[i]}.</span>${o}`;
    btn.onclick=()=>answer(i,btn);
    opts.appendChild(btn);
  });

  // reset per-question
  run.answered=false;
  run.usedHelpThisQ=false;
  run.usedCheatThisQ=false;
  $('feedback').classList.add('hidden');
  $('btnNext').classList.add('hidden');
  $('btnHelp').disabled = (run.helpLeft<=0);
  $('btnCheat').disabled = false;
  $('actionBar').style.display='flex';

  run.wasLocked=false;
  if(run.lockedNext){ // locked from previous cheat combo
    run.lockedNext=false;
    run.wasLocked=true;
    showFeedback('locked', `${g.name}站在你面前，目光如霜。祂没有说话，但你清楚地感到——接下来的这道题，祂不会再帮你了。`);
    $('btnHelp').disabled = true;
  }
}

/* feedback helper */
function showFeedback(type, text){
  const f=$('feedback');
  const g = GODS.find(x=>x.id===run.gid);
  f.className='feedback '+type;
  f.innerHTML=`<span class="speaker">${g.name} · ${g.sub}</span>${text}`;
  f.classList.remove('hidden');
}

function enableNext(){
  const n=$('btnNext');
  n.classList.remove('hidden');
  n.onclick=()=>{
    n.classList.add('hidden');
    run.idx++;
    if(run.idx>=5){ finishTrial(); }
    else{ renderQuestion(); }
  };
}

/* =========================================================
   HELP / CHEAT actions
========================================================= */
function bindActions(){
  $('btnHelp').onclick=()=>{
    if(run.answered || run.helpLeft<=0) return;
    const gid=run.gid, q=DATA[gid][run.idx];
    run.usedHelpThisQ=true;
    const g=GODS.find(x=>x.id===gid);
    showFeedback('helped', q.help);
    $('btnHelp').disabled=true;
  };
  $('btnCheat').onclick=()=>{
    if(run.answered) return;
    const gid=run.gid, q=DATA[gid][run.idx];
    run.usedCheatThisQ=true;
    const g=GODS.find(x=>x.id===gid);
    showFeedback('cheated', q.cheat);
    $('btnHelp').disabled=true;
    $('btnCheat').disabled=true;
  };
}

/* =========================================================
   ANSWERING LOGIC
========================================================= */
function answer(choice, btnEl){
  if(run.answered) return;
  const gid=run.gid, g=GODS.find(x=>x.id===gid), q=DATA[gid][run.idx];
  const isCorrect = choice===q.ans;
  const mode = run.usedCheatThisQ ? 'cheat' : (run.usedHelpThisQ ? 'help' : 'own');
  run.answered=true;
  btnEl.classList.add('answered');
  if(isCorrect) btnEl.classList.add('correct'); else btnEl.classList.add('wrong');

  const opts=$('options').children;
  for(const o of opts){ o.classList.add('dim'); }
  if(!isCorrect){ opts[q.ans].classList.remove('dim'); opts[q.ans].classList.add('correct'); }

  $('actionBar').style.display='none';

  let fbText='';
  const feedbackType = mode==='cheat'?'cheated':(mode==='help'?'helped':'');
  if(isCorrect) run.correct++;

  const helpTrustLite = ['lang','eng','chem','bio','geo'];
  const extraPenaltyForHist = (gid==='hist' && mode==='cheat') ? -1 : 0;

  if(mode==='own'){
    if(isCorrect){ run.trust+=2; run.corrCombo++; }
    else{ run.corrCombo=0; fbText=q.fbErr; }
  } else if(mode==='help'){
    run.helpUsed++; run.nonIndep++; run.helpLeft--;
    run.corrCombo=0;
    run.trust += helpTrustLite.includes(gid) ? 1 : 0;
    fbText = isCorrect ? (q.fbHelp + "<br>祂替你拨开迷雾，而你接住了答案。") : (q.fbHelp + "<br>“祂已经尽力提示你了。”");
  } else if(mode==='cheat'){
    run.cheatUsed++; run.nonIndep++; run.cheatCombo++;
    run.corrCombo=0;
    const pen = isCorrect ? -2 : -3;
    run.trust += pen + extraPenaltyForHist;
    fbText = isCorrect ? q.fbCheat : (q.cheatErr + "<br>“你看到了答案，却还是选错。”");
  }

  // If this was a locked question and player chose NOT to cheat on it, reset cheat combo
  if(run.wasLocked && mode!=='cheat'){
    run.cheatCombo=0;
  }

  if(mode==='own' && isCorrect) fbText=q.fbCorr;

  run.records.push({num:run.idx+1, mode, correct:isCorrect, trust:run.trust});

  let heartText=null;
  if(mode==='own' && isCorrect && (run.corrCombo===3 || run.corrCombo===5) && run.heartCount<3){
    heartText = (run.corrCombo===3? q.heart3 : q.heart5);
    run.heartCount++;
  }

  if(run.cheatCombo>=2) run.lockedNext=true;

  run.trust = Math.max(-10, Math.min(10, run.trust));

  const speaker = `${g.name} · ${g.sub}`;
  const html = `<span class="speaker">${speaker}</span>${fbText||''}`;
  $('feedback').className = 'feedback '+(feedbackType||'');
  $('feedback').innerHTML = html;
  $('feedback').classList.remove('hidden');

  if(heartText){
    $('feedback').className='feedback heartz';
    $('feedback').innerHTML=`<span class="speaker">${speaker} · 心动</span>${heartText}`;
    setTimeout(()=>{
      $('feedback').className='feedback '+(feedbackType||'');
      $('feedback').innerHTML=html;
      enableNext();
    },1800);
  } else {
    enableNext();
  }
}

/* =========================================================
   FINISH TRIAL -> compute ending
========================================================= */
function finishTrial(){
  const gid=run.gid, g=GODS.find(x=>x.id===gid);
  const cheat=run.cheatUsed, nonIndep=run.nonIndep, corr=run.correct, trust=run.trust;
  let type;
  if(cheat>=2){ type='fallen'; }
  else if(nonIndep>=3){ type='depend'; }
  else if(corr===5){ type='perfect'; }
  else if(corr>=3){ type='normal'; }
  else { type='fail'; }

  let text = ENDINGS[type].god[gid];
  if((type==='perfect'||type==='normal') && trust>=8 && CONFESS[gid]){
    text += CONFESS[gid];
  }

  if(!G.gods) G.gods={};
  G.gods[gid]=type;
  if(!G.history) G.history=[];
  G.history.push({gid, type, trust, correct:corr, help:run.helpUsed, cheat:run.cheatUsed, date:Date.now()});
  if(!G.watcher) G.watcher={unlocked:false, chosen:null};
  save();
  G=loadSave();

  const badge=$('endBadge');
  badge.textContent = ENDINGS[type].title;
  badge.className='ending-badge '+type;
  $('endText').innerHTML = text;
  $('endTitle').textContent = `${g.name} · ${g.sub} · 结局`;
  $('endStats').innerHTML = [
    `正确 <b>${corr}</b>/5`,
    `求助 <b>${run.helpUsed}</b>`,
    `作弊 <b>${run.cheatUsed}</b>`,
    `信赖值 <b>${trust}</b>`
  ].map(s=>`<div class="stat">${s}</div>`).join('');

  show('ending');
}

/* =========================================================
   WATCHER
========================================================= */
function openWatcher(){
  $('watSpeech').innerHTML = WATCHER_INTRO;
  const box=$('whoOptions'); box.innerHTML='';
  let html='';
  WHO_LIST.forEach(g=>{
    html+=`<button class="who" data-id="${g.id}"><span class="wn">${g.label}</span></button>`;
  });
  html+=`<button class="who self" data-opt="self"><span class="wn">被你自己记住</span></button>`;
  html+=`<button class="who leave" data-opt="leave"><span class="wn">谁都不选，走出这里</span></button>`;
  box.innerHTML=html;
  box.querySelectorAll('.who').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.id, opt=b.dataset.opt;
      if(!G.watcher) G.watcher={unlocked:false,chosen:null};
      G.watcher.chosen = opt||id;
      G.watcher.chosenLabel = b.textContent.trim();
      save(); G=loadSave();
      const e = opt==='self'?WATCHER_ENDINGS.self : opt==='leave'?WATCHER_ENDINGS.leave : WATCHER_ENDINGS[id];
      $('watResultBadge').textContent=e.title;
      $('watResultBadge').className='ending-badge perfect';
      $('watResultText').innerHTML=e.text;
      show('watcherResult');
    };
  });
}

/* =========================================================
   MODAL
========================================================= */
let modalCb=null;
function showModal(title,text,opt){
  $('modalTitle').textContent=title;
  $('modalText').innerHTML=text;
  $('modalOk').textContent=(opt&&opt.ok)||'确 定';
  const cc=$('modalCancel');
  if(opt&&opt.cancel){ cc.textContent=opt.cancel; cc.classList.remove('hidden'); } else { cc.classList.add('hidden'); }
  modalCb=opt&&opt.cb;
  $('modal').classList.add('active');
}
function closeModal(){ $('modal').classList.remove('active'); modalCb=null; }
$('modalOk').onclick=()=>{ const cb=modalCb; closeModal(); if(cb) cb(true); };
$('modalCancel').onclick=()=>{ const cb=modalCb; closeModal(); if(cb) cb(false); };

/* =========================================================
   RECORDS / ARCHIVE
========================================================= */
function openRecords(){
  let html='<div class="records">';
  const hist=(G.history||[]).slice().reverse();
  if(hist.length===0){
    html+='<p style="color:#888">还没有任何试炼记录。</p>';
  } else {
    GODS.forEach(g=>{
      const mine=hist.filter(h=>h.gid===g.id);
      if(mine.length===0) return;
      html+=`<div class="r"><h3>${g.name} · ${g.sub}</h3>`;
      mine.forEach(h=>{
        const cls = h.type==='depend'?'purple':h.type==='fallen'?'red':h.type==='fail'?'gray':'';
        const tname = ENDINGS[h.type] ? ENDINGS[h.type].title : h.type;
        html+=`<p class="${cls}">${new Date(h.date).toLocaleString()} — ${tname} · 正确${h.correct}/5 · 信赖${h.trust}</p>`;
      });
      html+='</div>';
    });
  }
  html+='</div>';
  showModal('羁绊档案', html);
}

/* =========================================================
   HOW-TO
========================================================= */
const HOWTO = `每门学科都是一位“神明”的试炼。每轮 5 道题。你可以：
· <b>自己作答</b> —— 答对 +2 信赖；答错祂会点拨你（但不加分）。
· <b>求助神明</b> —— 每轮最多 3 次，祂会给你提示（大多数神明 +1 信赖）。
· <b>作弊</b> —— 无次数限制，直接看到答案，但信赖大幅下降，且让神明失望。

结局由「正确率」「求助+作弊次数」「作弊次数」共同决定：
· 作弊 ≥ 2 → 堕落线（关系破裂）
· 求助+作弊 ≥ 3，且作弊<2 → 依赖线（隐藏结局）
· 5 题全对 → 完美通关
· 对 ≥ 3 题 → 普通通关
· 否则 → 失败线

连续 3 次自己答对，会触发神明的心动台词。
九科全部通过后，将解锁隐藏的「第十门学科」。`;

/* =========================================================
   BUTTONS (global)
========================================================= */
function bindGlobal(){
  $('btnRecords').onclick=openRecords;
  $('btnHow').onclick=()=>showModal('试炼说明', HOWTO);
  $('btnReset').onclick=()=>{
    showModal('重置全部数据','确定要清空所有试炼记录、结局和第十门学科进度吗？此操作不可恢复。',{
      ok:'重置', cancel:'取消',
      cb:(yes)=>{ if(yes){ localStorage.removeItem(LS_KEY); G=loadSave(); renderMenu(); } }
    });
  };
  $('btnExit').onclick=()=>{
    showModal('退出试炼','当前进度不会保存。确定退出吗？',{
      ok:'退出', cancel:'继续做题',
      cb:(yes)=>{ if(yes){ run=null; show('menu'); renderMenu(); } }
    });
  };
  $('btnBackMenu').onclick=()=>{ show('menu'); renderMenu(); };
  $('btnReplay').onclick=()=>{ if(run) startTrial(run.gid); };
  $('btnWatBack').onclick=()=>{ show('menu'); renderMenu(); };
  $('watcherZero').onclick=openWatcher;
}

/* =========================================================
   INIT
========================================================= */
function init(){
  bindGlobal();
  bindActions();
  renderMenu();
}
document.addEventListener('DOMContentLoaded', init);
</script>
